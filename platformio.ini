; Plane Radar 3D — 5" branch: Waveshare ESP32-S3-Touch-LCD-5 (800x480) / -5B (1024x600).
; The 4" ESP32-WROOM build lives on the main branch.
; Build: PLATFORMIO_CORE_DIR=~/.pio-ws5 pio run -e ws5   (see README)

[platformio]
default_envs = ws5

; Waveshare ESP32-S3-Touch-LCD-5: 5" 800x480 IPS RGB panel, GT911 capacitive touch,
; CH422G expander (backlight, resets), ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM).
; Console = the native USB port (keyboard or setup mode, hardware/console.h); setup page,
; updates and the stream deck keyboard all use the same cable.
[env:ws5]
; Arduino core 3.x (ESP-IDF 5): its RGB LCD driver has bounce buffers, without which
; the panel loses data whenever the CPU is busy in PSRAM (picture drops out).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions/plane_radar_16mb.csv
; The rebuild starts from the generic (quad PSRAM) Arduino sdkconfig, so the board's
; octal PSRAM settings (as in the prebuilt qio_opi variant) are listed first.
; Instruction cache 32 KB (default 16 KB): with code running from PSRAM the drawing
; loops kept missing the small cache. Data cache stays 32 KB (internal RAM).
; RGB panel without drift (ESP FAQ "LCD"): 64-byte data cache lines are required in
; bounce-buffer mode, code/rodata run from PSRAM so flash writes (Wi-Fi, NVS, OTA) do not
; stall the LCD interrupt, Wi-Fi/LWIP buffers stay in internal RAM. pioarduino rebuilds
; the Arduino libraries with these settings (first build takes a while).
custom_sdkconfig =
  CONFIG_SPIRAM_MODE_OCT=y
  # CONFIG_SPIRAM_MODE_QUAD is not set
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_IGNORE_NOTFOUND=y
  CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
  # CONFIG_ESP_WIFI_STATIC_TX_BUFFER is not set
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
  CONFIG_ESP_WIFI_RX_BA_WIN=6
  CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
  # CONFIG_ESP32S3_INSTRUCTION_CACHE_16KB is not set
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  # CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is not set
  CONFIG_COMPILER_OPTIMIZATION_PERF=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_CDC_ENABLED=y
  CONFIG_TINYUSB_HID_ENABLED=y
; TinyUSB (USB keyboard next to the serial port) comes from components/arduino_tinyusb:
; the library rebuild does not fetch it by itself.
; Components the radar does not use (shorter lib rebuild; esp_rainmaker's embedded
; certificate also breaks pioarduino's rebuild).
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp-sr
  espressif/esp_modem
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/network_provisioning
  chmorgan/esp-libhelix-mp3

extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw

; ARDUINO_USB_MODE=0 (set in the board's own flags, which define it as 1) and no CDC on
; boot: the firmware picks the USB mode itself at start (hardware/console.h), TinyUSB
; serial port + USB keyboard for the stream deck, or the USB-Serial/JTAG port for setup.
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  -std=gnu++17
  -DBOARD_WS5
  -DBOARD_HAS_PSRAM
  -O2
  -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
  -std=gnu++11
  -Os

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2


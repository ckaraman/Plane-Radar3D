; Plane Radar 3D — ESP32-WROOM-32U DevKit + 4.0" ST7796S 480x320 (XPT2046 touch) + SHT30
; Arduino IDE equivalent: board "ESP32 Dev Module", partition scheme from partitions/.

[env:wroom32u]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15) used on the setup / status screens
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2

; Waveshare ESP32-S3-Touch-LCD-5: 5" 800x480 IPS RGB panel, GT911 capacitive touch,
; CH422G expander (backlight, resets), ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM).
; Serial = the native USB port (USB CDC), so the setup page and updates use the same cable.
[env:ws5]
; Arduino core 3.x (ESP-IDF 5): its RGB LCD driver has bounce buffers, without which
; the panel loses data whenever the CPU is busy in PSRAM (picture drops out).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions/plane_radar_16mb.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DBOARD_WS5
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
  -std=gnu++11

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2

; Same board, 1024x600 panel ("ESP32-S3-Touch-LCD-5B", SKU 28151).
[env:ws5b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions/plane_radar_16mb.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DBOARD_WS5
  -DBOARD_WS5B
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
  -std=gnu++11

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2

# Compile check for the stream deck branch: builds ws5 and ws5b, publishes nothing.
name: Deck build check

on:
  push:
    branches: [ws5-deck]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ws5, ws5b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv
      - name: Build
        run: |
          export PATH="$HOME/pio-s3/bin:$PATH"
          set -o pipefail
          PLATFORMIO_CORE_DIR="$HOME/.pio-core-${{ matrix.env }}" pio run -e ${{ matrix.env }} -t merge 2>&1 | tee build.log || {
            # Errors as annotations (readable from the API without the log download).
            grep -nE "error|Error|undefined reference" build.log | head -40 | while IFS= read -r l; do
              echo "::error::${l:0:900}"
            done
            tail -15 build.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            exit 1
          }
          B=.pio/build/${{ matrix.env }}
          # Octal PSRAM (a quad build boot-loops on this board) and TinyUSB in the rebuilt libs.
          grep -q "CONFIG_SPIRAM_MODE_OCT 1" $B/config/sdkconfig.h || { echo "::error::built without octal PSRAM"; exit 1; }
          grep -q "CONFIG_TINYUSB_HID_ENABLED 1" $B/config/sdkconfig.h || { echo "::error::built without TinyUSB HID"; exit 1; }
          NM=$(ls ~/.pio-core-${{ matrix.env }}/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-nm 2>/dev/null || ls ~/.pio-core-${{ matrix.env }}/packages/toolchain-xtensa-esp*/bin/*-nm | head -1)
          for sym in HWCDC::begin USBCDC::begin tud_hid_n_report tud_cdc_n_write; do
            $NM -C $B/firmware.elf | grep -q "$sym" && echo "::notice::$sym linked" || { echo "::error::$sym missing"; exit 1; }
          done
          ls -l $B/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware-merged.bin

# Build check of the Windows helper on its work branch (no site publish).
name: Deck app check

on:
  push:
    branches: [deck-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deckapp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: tools/deck-windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Icon
        working-directory: tools/deck-windows
        run: python -c "import app; img = app.tray_image().resize((256, 256)); img.save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build
        working-directory: tools/deck-windows
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PlaneRadarDeck --icon icon.ico
          --add-data "web;web" --collect-all webview --collect-submodules winrt
          --hidden-import pystray._win32 --hidden-import win32com.client app.py
      - name: Self test (the packed program starts and loads its parts)
        working-directory: tools/deck-windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PlaneRadarDeck.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::self test failed ($($p.ExitCode))"; exit 1 }
          Get-Item dist\PlaneRadarDeck.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: deck-windows
          path: tools/deck-windows/dist/PlaneRadarDeck.exe


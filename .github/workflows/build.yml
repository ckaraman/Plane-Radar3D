# Builds the 5" Waveshare ESP32-S3-Touch-LCD-5 (800x480) firmware and the PC helper,
# and publishes the setup / update page with them (GitHub Pages).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Windows helper for the control screen (helper/): one .exe for the site.
  deckapp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: helper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Icon
        working-directory: helper
        run: python -c "import app; img = app.tray_image().resize((256, 256)); img.save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build
        working-directory: helper
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PlaneRadarDeck --icon icon.ico
          --add-data "web;web" --add-data "browser-extension;browser-extension" --collect-all webview
          --collect-submodules winrt --collect-submodules websockets
          --hidden-import pystray._win32 --hidden-import win32com.client app.py
      - name: Self test (the packed program starts and loads its parts)
        working-directory: helper
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PlaneRadarDeck.exe -ArgumentList "--selftest","--deep" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::self test failed ($($p.ExitCode))"; exit 1 }
          if (Test-Path selftest.txt) { Get-Content selftest.txt | ForEach-Object { Write-Output "::notice::$_" } }
          # Window test: the editor opens, closes and opens again, then the program quits.
          $p = Start-Process -FilePath dist\PlaneRadarDeck.exe -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Output "::warning::window test did not finish" }
          if (Test-Path smoke.txt) { Get-Content smoke.txt | ForEach-Object { Write-Output "::notice::$_" } } else { Write-Output "::warning::no window test result" }
          Get-Item dist\PlaneRadarDeck.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: deck-windows
          path: helper/dist/PlaneRadarDeck.exe

  # Mac helper (same program, macOS parts): a .dmg each for Apple M and Intel Macs.
  deckapp-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            dmg: PlaneRadarDeck-mac.dmg
          - runner: macos-15-intel
            dmg: PlaneRadarDeck-mac-intel.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: helper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller
      - name: Build
        working-directory: helper
        run: ./build_mac.sh ${{ matrix.dmg }} 2>&1 | tail -40; test -f dist/${{ matrix.dmg }} || { echo "::error::mac build failed"; exit 1; }
      - name: Self test
        working-directory: helper
        run: echo "::notice::$(uname -m) $(sw_vers -productVersion)"; ./selftest_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deck-${{ matrix.dmg }}
          path: helper/dist/${{ matrix.dmg }}

  firmware:
    needs: [deckapp, deckapp-mac]
    # The site still goes out (with the firmware) if only a helper failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .pio/libdeps
          key: ${{ runner.os }}-pio3-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio3-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write setup page address (shown on the device screen)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          printf '#pragma once\n#define SETUP_PAGE_URL "%s.github.io/%s"\n' "$OWNER" "$REPO" > include/setup_url.h
          cat include/setup_url.h

      # Arduino core 3 (pioarduino), whose Arduino libraries are rebuilt with custom_sdkconfig.
      # Own venv: PlatformIO 6.1.18 (its SCons works with the lib rebuild), click < 8.2
      # (esptool 5), uv (ESP-IDF Python deps), and its own core dir (the rebuild replaces
      # the libs in the packages folder).
      - name: Set up PlatformIO
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv

      - name: Build + merge
        run: |
          export PATH="$HOME/pio-s3/bin:$PATH"
          # Errors as annotations: readable without downloading the log.
          set -o pipefail
          PLATFORMIO_CORE_DIR="$HOME/.pio-core-ws5" pio run -e ws5 -t merge 2>&1 | tee pio.log || {
            grep -nE "error|Error|undefined reference|overflow|too big" pio.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            tail -12 pio.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            exit 1
          }
          # Guard: the board has octal PSRAM; a quad-PSRAM build boot-loops on it.
          grep -q "CONFIG_SPIRAM_MODE_OCT 1" .pio/build/ws5/config/sdkconfig.h || { echo "::error::built without octal PSRAM"; exit 1; }
          ls -l .pio/build/ws5/*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-3d-firmware
          if-no-files-found: error
          path: |
            .pio/build/ws5/firmware-merged.bin
            .pio/build/ws5/firmware.bin

      - name: Helper protocol tests (fake card)
        run: |
          pip install pyserial pillow "websockets>=13"
          python helper/tests/test_core.py

      - name: Windows helper from the deckapp job
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deck-windows
          path: out/deck

      - name: Mac helpers from the deckapp-mac jobs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: deck-PlaneRadarDeck-mac*
          merge-multiple: true
          path: out/deck

      - name: Assemble web site
        run: |
          set -x
          trap 'echo "::error title=assemble::failed at line $LINENO: $BASH_COMMAND"' ERR
          VERSION=$(sed -n 's/^constexpr char kFirmwareVersion\[\] = "\([^"]*\)";.*/\1/p' include/config.h | head -n 1)
          test -n "$VERSION"
          mkdir -p site
          cp web/index.html web/tz.json web/tz-LICENSE.txt site/
          B=.pio/build/ws5
          cp $B/firmware.bin site/firmware-ws5.bin
          cp $B/firmware-merged.bin site/firmware-merged-ws5.bin
          cp $B/bootloader.bin site/bootloader-ws5.bin
          cp $B/partitions.bin site/partitions-ws5.bin
          (cd tools/usb-kopru && zip -q ../../site/radar-usb-kopru.zip USB-Kopru-Baslat.bat usb-koprusu.ps1)
          chmod +x tools/usb-kopru-mac/Kopru-Baslat.command tools/usb-kopru-mac/radar_kopru.py
          (cd tools && zip -q -r ../site/radar-usb-kopru-mac.zip usb-kopru-mac)
          if [ -f out/deck/PlaneRadarDeck.exe ]; then cp out/deck/PlaneRadarDeck.exe site/; else echo "::warning::Windows helper not built"; fi
          for d in PlaneRadarDeck-mac.dmg PlaneRadarDeck-mac-intel.dmg; do
            if [ -f "out/deck/$d" ]; then cp "out/deck/$d" site/; else echo "::warning::$d not built"; fi
          done
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]

          def write(path, name, parts):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump({"name": name, "version": version, "new_install_prompt_erase": True,
                             "builds": [{"chipFamily": "ESP32-S3", "parts": parts}]}, f, indent=2)

          # The S3 boots from 0x0. The old-method update writes the first app slot, so it
          # also blanks otadata (0xE000): otherwise a board that ran from the second slot after a
          # USB update would keep booting that one. NVS (settings) and the map stay.
          with open("site/otadata-blank.bin", "wb") as f:
              f.write(b"\xff" * 0x2000)
          write("site/manifest-update-ws5.json", "Plane Radar 3D 5in update", [
              {"path": "bootloader-ws5.bin", "offset": 0},
              {"path": "partitions-ws5.bin", "offset": 32768},
              {"path": "otadata-blank.bin", "offset": 57344},
              {"path": "firmware-ws5.bin", "offset": 65536}])
          write("site/manifest-full-ws5.json", "Plane Radar 3D 5in full install",
                [{"path": "firmware-merged-ws5.bin", "offset": 0}])
          # shortcut: "version" (the old 4in key) repeats the 5in one until the page drops the 4in model (stage 4).
          with open("site/version.json", "w", encoding="utf-8") as f:
              json.dump({"version": version, "version_ws5": version}, f)
          PY
          ls -l site

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Needs: repository Settings -> Pages -> Source = "GitHub Actions".
    if: github.event_name != 'pull_request'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

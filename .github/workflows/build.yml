# Builds both device models and publishes the setup / update page with their firmware:
#   main branch -> 4" ESP32-WROOM-32U + ST7796 (Arduino core 2.0.14)
#   ws5 branch  -> 5" Waveshare ESP32-S3-Touch-LCD-5 / -5B (Arduino core 3, pioarduino)
# A push to ws5 starts this workflow on main (see the workflow on that branch), so the
# site always carries the latest firmware of both.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (4", this branch)
        uses: actions/checkout@v4

      - name: Checkout ws5 branch (5")
        uses: actions/checkout@v4
        with:
          ref: ws5
          path: ws5

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
            ws5/.pio/libdeps
          key: ${{ runner.os }}-pio2-${{ hashFiles('platformio.ini', 'ws5/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Write setup page address (shown on the device screen)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          printf '#pragma once\n#define SETUP_PAGE_URL "%s.github.io/%s"\n' "$OWNER" "$REPO" > include/setup_url.h
          cp include/setup_url.h ws5/include/setup_url.h
          cat include/setup_url.h

      - name: Build + merge (4")
        run: pio run -e wroom32u -t merge

      # The 5" boards build on Arduino core 3 (pioarduino), whose Arduino libraries are
      # rebuilt with custom_sdkconfig. Own venv: PlatformIO 6.1.18 (its SCons works with
      # the lib rebuild), click < 8.2 (esptool 5), uv (ESP-IDF Python deps). Each env gets
      # its own PlatformIO core dir: the rebuild replaces the libs in the packages folder.
      - name: Set up PlatformIO for the 5" boards
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv

      - name: Build + merge (5" 800x480 and 5B 1024x600)
        working-directory: ws5
        run: |
          export PATH="$HOME/pio-s3/bin:$PATH"
          # The library rebuild wipes .pio/build, so each env's images are copied out at once.
          PLATFORMIO_CORE_DIR="$HOME/.pio-core-ws5" pio run -e ws5 -t merge
          mkdir -p ../out/ws5 ../out/ws5b
          cp .pio/build/ws5/*.bin ../out/ws5/
          # Guard: the board has octal PSRAM; a quad-PSRAM build boot-loops on it.
          grep -q "CONFIG_SPIRAM_MODE_OCT 1" .pio/build/ws5/config/sdkconfig.h || { echo "::error::ws5 built without octal PSRAM"; exit 1; }
          PLATFORMIO_CORE_DIR="$HOME/.pio-core-ws5b" pio run -e ws5b -t merge
          cp .pio/build/ws5b/*.bin ../out/ws5b/
          grep -q "CONFIG_SPIRAM_MODE_OCT 1" .pio/build/ws5b/config/sdkconfig.h || { echo "::error::ws5b built without octal PSRAM"; exit 1; }
          ls -l ../out/ws5 ../out/ws5b

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-3d-firmware
          if-no-files-found: error
          path: |
            .pio/build/wroom32u/firmware-merged.bin
            .pio/build/wroom32u/firmware.bin
            out/ws5/firmware-merged.bin
            out/ws5/firmware.bin
            out/ws5b/firmware-merged.bin
            out/ws5b/firmware.bin

      - name: Assemble web site
        run: |
          set -x
          trap 'echo "::error title=assemble::failed at line $LINENO: $BASH_COMMAND"' ERR
          ver() { sed -n 's/^constexpr char kFirmwareVersion\[\] = "\([^"]*\)";.*/\1/p' "$1" | head -n 1; }
          VERSION=$(ver include/config.h)
          VERSION_WS5=$(ver ws5/include/config.h)
          test -n "$VERSION" && test -n "$VERSION_WS5"
          mkdir -p site
          cp web/index.html web/tz.json web/tz-LICENSE.txt site/
          B=.pio/build/wroom32u
          cp $B/firmware.bin $B/firmware-merged.bin $B/bootloader.bin $B/partitions.bin site/
          W=out/ws5
          cp $W/firmware.bin site/firmware-ws5.bin
          cp $W/firmware-merged.bin site/firmware-merged-ws5.bin
          cp $W/bootloader.bin site/bootloader-ws5.bin
          cp $W/partitions.bin site/partitions-ws5.bin
          cp out/ws5b/firmware.bin site/firmware-ws5b.bin
          cp out/ws5b/firmware-merged.bin site/firmware-merged-ws5b.bin
          (cd tools/usb-kopru && zip -q ../../site/radar-usb-kopru.zip USB-Kopru-Baslat.bat usb-koprusu.ps1)
          chmod +x tools/usb-kopru-mac/Kopru-Baslat.command tools/usb-kopru-mac/radar_kopru.py
          (cd tools && zip -q -r ../site/radar-usb-kopru-mac.zip usb-kopru-mac)
          python3 - "$VERSION" "$VERSION_WS5" <<'PY'
          import json, sys
          version, version_ws5 = sys.argv[1], sys.argv[2]

          def write(path, name, ver, chip, parts):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump({"name": name, "version": ver, "new_install_prompt_erase": True,
                             "builds": [{"chipFamily": chip, "parts": parts}]}, f, indent=2)

          # 4": update keeps the settings (NVS at 0x9000); the classic ESP32 boots from 0x1000.
          write("site/manifest-update.json", "Plane Radar 3D 4in update", version, "ESP32", [
              {"path": "bootloader.bin", "offset": 4096},
              {"path": "partitions.bin", "offset": 32768},
              {"path": "firmware.bin", "offset": 65536}])
          write("site/manifest-full.json", "Plane Radar 3D 4in full install", version, "ESP32",
                [{"path": "firmware-merged.bin", "offset": 0}])
          # 5": the S3 boots from 0x0. The old-method update writes the first app slot, so it
          # also blanks otadata (0xE000): otherwise a board that ran from the second slot after a
          # USB update would keep booting that one. NVS (settings) and the map stay.
          with open("site/otadata-blank.bin", "wb") as f:
              f.write(b"\xff" * 0x2000)
          write("site/manifest-update-ws5.json", "Plane Radar 3D 5in update", version_ws5, "ESP32-S3", [
              {"path": "bootloader-ws5.bin", "offset": 0},
              {"path": "partitions-ws5.bin", "offset": 32768},
              {"path": "otadata-blank.bin", "offset": 57344},
              {"path": "firmware-ws5.bin", "offset": 65536}])
          write("site/manifest-full-ws5.json", "Plane Radar 3D 5in full install", version_ws5, "ESP32-S3",
                [{"path": "firmware-merged-ws5.bin", "offset": 0}])
          write("site/manifest-full-ws5b.json", "Plane Radar 3D 5in (5B 1024x600) full install", version_ws5,
                "ESP32-S3", [{"path": "firmware-merged-ws5b.bin", "offset": 0}])
          with open("site/version.json", "w", encoding="utf-8") as f:
              json.dump({"version": version, "version_ws5": version_ws5}, f)
          PY
          ls -l site

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Needs: repository Settings -> Pages -> Source = "GitHub Actions".
    if: github.event_name != 'pull_request'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

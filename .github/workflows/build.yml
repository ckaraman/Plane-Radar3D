# 5" branch: the firmware and the setup page are built and published by the workflow
# on main (it builds both branches into one site). A push here just starts that run.
name: Build

on:
  push:
    branches: [ws5]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start-main-build:
    runs-on: ubuntu-latest
    steps:
      - name: Run the main build (4" + 5" firmware, setup page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
